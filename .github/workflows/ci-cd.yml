name: Ticket Analyzer CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ticket-analyzer-backend
  S3_BUCKET: ticket-analyzer-dev-frontend-35709762 # Helper default, will be overridden by Secret if present

jobs:
  # =========================================================
  # BACKEND PIPELINE
  # =========================================================
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx flake8 black
      - name: Linter
        working-directory: ./backend
        run: |
          black --check app/ || echo "Black found formatting issues"
          flake8 app/ --max-line-length=100 --ignore=E203,W503
      - name: Run Tests
        working-directory: ./backend
        env:
          DYNAMODB_TABLE_NAME: tickets-test
          OPENAI_API_KEY: "dummy" # For testing
        run: pytest tests/ -v

  backend-deploy:
    name: Backend Deploy
    needs: backend-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd backend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            docker stop ticket-analyzer-backend || true
            docker rm ticket-analyzer-backend || true
            docker run -d --name ticket-analyzer-backend \
              --restart unless-stopped \
              -p 8000:8000 \
              -e OPENAI_API_KEY=$(aws ssm get-parameter --name /ticket-analyzer/dev/openai-api-key --with-decryption --query Parameter.Value --output text) \
              -e AWS_REGION=${{ env.AWS_REGION }} \
              -e DYNAMODB_TABLE_NAME=${{ secrets.DYNAMODB_TABLE_NAME }} \
              ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  # =========================================================
  # FRONTEND PIPELINE
  # =========================================================
  frontend-deploy:
    name: Frontend Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # Use secret if available, else fall back to known bucket (or fail)
          BUCKET="${{ secrets.S3_BUCKET_NAME }}"
          if [ -z "$BUCKET" ]; then
             echo "S3_BUCKET_NAME secret is missing!"
             exit 1
          fi
          aws s3 sync frontend/dist s3://$BUCKET --delete

      - name: Invalidate CloudFront
        run: |
          DIST_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          if [ -n "$DIST_ID" ]; then
            echo "Invalidating CloudFront Distribution: $DIST_ID"
            aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
          else
            echo "::warning::CLOUDFRONT_DISTRIBUTION_ID secret not set. Skipping invalidation."
          fi
